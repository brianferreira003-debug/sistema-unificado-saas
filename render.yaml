services:
  - type: web
    name: sistema-unificado-saas
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_server:app --bind 0.0.0.0:$PORT --workers 2
    plan: free
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
